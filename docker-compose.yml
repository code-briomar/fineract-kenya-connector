version: "3.8"

services:
  fineract-db:
    image: postgres:15-alpine
    container_name: fineract-db
    environment:
      POSTGRES_DB: fineract_tenants
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 400M

  fineract-server:
    image: apache/fineract:latest
    container_name: fineract-server
    depends_on:
      - fineract-db
    ports:
      - "8443:8443"
    environment:
      # Hikari Database Connection (Points to fineract-db)
      - FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://fineract-db:5432/fineract_tenants
      - FINERACT_HIKARI_USERNAME=postgres
      - FINERACT_HIKARI_PASSWORD=password

      # Tenant Database Settings
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=fineract-db
      - FINERACT_DEFAULT_TENANTDB_PORT=5432
      - FINERACT_DEFAULT_TENANTDB_UID=postgres
      - FINERACT_DEFAULT_TENANTDB_PWD=password
      - FINERACT_DEFAULT_TENANTDB_NAME=fineract_default
      - FINERACT_DEFAULT_TENANTDB_TIMEZONE=UTC

      # JVM Heap limit to keep memory calm
      - JAVA_TOOL_OPTIONS=-Xmx1024M -Xms512M
    deploy:
      resources:
        limits:
          memory: 1400M
